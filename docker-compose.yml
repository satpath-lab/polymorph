services:
  polymorph:
    build: .
    ports: ["8787:8787"]
    environment:
      POLY_ADMIN_PASSWORD: ${POLY_ADMIN_PASSWORD:?set an admin password}
      POLY_DEVICE_KEY: ${POLY_DEVICE_KEY:-}
      POLY_WORKERS: "8"
    volumes:
      - poly-data:/data
      - ./apps:/app/apps
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  poly-data:
