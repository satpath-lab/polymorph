services:
  voltforge:
    build: .
    ports: ["8787:8787"]
    environment:
      VOLT_ADMIN_PASSWORD: ${VOLT_ADMIN_PASSWORD:?set an admin password}
      VOLT_DEVICE_KEY: ${VOLT_DEVICE_KEY:-}
      VOLT_WORKERS: "8"
    volumes:
      - volt-data:/data
      - ./apps:/app/apps
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  volt-data:
