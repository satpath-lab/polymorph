name: VoltForge CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtimes
        run: sudo apt-get update && sudo apt-get install -y lua5.4 php-cli ruby && sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
      - name: Run app tests
        run: python3 volt.py test --all

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VOLT_URL: ${{ secrets.VOLT_URL }}
      VOLT_API_TOKEN: ${{ secrets.VOLT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Sync changed apps and cut releases
        run: |
          set -euo pipefail
          for app in $(git diff --name-only HEAD~1 HEAD -- apps | cut -d/ -f2 | sort -u); do
            [ -d "apps/$app" ] || continue
            echo "→ $app"
            tar czf - -C "apps/$app" . | curl -fsS "$VOLT_URL/api/sync/$app" -H "Authorization: Bearer $VOLT_API_TOKEN" --data-binary @-
            curl -fsS "$VOLT_URL/api/release/$app" -H "Authorization: Bearer $VOLT_API_TOKEN" \
              -d "{\"note\": \"${GITHUB_SHA::7} $(git log -1 --pretty=%s | tr -d '"')\"}"
          done
